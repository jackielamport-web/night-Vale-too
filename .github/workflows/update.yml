name: Find skips in new episodes

on:
  schedule:
    - cron: "23 6 * * *"   # daily, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-episodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'base.en' }}

      - name: Install dependencies
        run: pip install faster-whisper==1.1.1 feedparser==6.0.11 requests==2.32.3

      - name: Process new episodes
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          MAX_NEW: ${{ vars.MAX_NEW }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/process.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git diff --cached --quiet || (git commit -m "Update episode skips" && git push)
